<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Civi</title>
  <desc id="desc">Livre civique français avec monument républicain et drapeau tricolore.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D73E6"/>
      <stop offset=".48" stop-color="#174DB7"/>
      <stop offset="1" stop-color="#102B6B"/>
    </linearGradient>
    <linearGradient id="leftPage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BCE5FF"/>
      <stop offset="1" stop-color="#4D9BEE"/>
    </linearGradient>
    <linearGradient id="rightPage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5360"/>
      <stop offset="1" stop-color="#E62434"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#07173D" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect x="22" y="22" width="468" height="468" rx="104" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- République / institution -->
  <g fill="#fff">
    <path d="M190 197c7-32 31-54 66-54s59 22 66 54H190z"/>
    <rect x="176" y="194" width="160" height="16" rx="8"/>
    <rect x="198" y="215" width="21" height="91" rx="10"/>
    <rect x="246" y="215" width="21" height="111" rx="10"/>
    <rect x="294" y="215" width="21" height="91" rx="10"/>
  </g>

  <!-- Drapeau -->
  <rect x="251" y="95" width="9" height="58" rx="4.5" fill="#fff"/>
  <path d="M260 99c22-10 36 7 56 7 9 0 17-3 24-7v43c-8 4-16 7-25 7-20 0-34-17-55-7V99z" fill="#fff"/>
  <path d="M260 99c8-4 16-5 24-2v43c-8-2-16-2-24 2V99z" fill="#2D73E6"/>
  <path d="M316 106c9 0 17-3 24-7v43c-8 4-16 7-24 7v-43z" fill="#F12E3D"/>

  <!-- Livre -->
  <path d="M82 279c68-1 123 34 174 99v73c-48-53-105-77-174-77v-95z" fill="url(#leftPage)"/>
  <path d="M430 279c-68-1-123 34-174 99v73c48-53 105-77 174-77v-95z" fill="url(#rightPage)"/>
  <path d="M82 335c70 0 126 32 174 96v29c-47-44-104-64-174-64v-61z" fill="#fff"/>
  <path d="M430 335c-70 0-126 32-174 96v29c47-44 104-64 174-64v-61z" fill="#fff"/>
  <path d="M82 390c70 1 127 22 174 70-58-28-116-38-174-31v-39z" fill="#4D9BEE"/>
  <path d="M430 390c-70 1-127 22-174 70 58-28 116-38 174-31v-39z" fill="#4D9BEE"/>
  <path d="M256 378v82" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".95"/>
</svg>