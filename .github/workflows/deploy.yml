name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh CCI exam sessions
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check requests
          if ! python scripts/scrape_cci_sessions.py --france --product 22 --delay 1 --output public/data/cci_sessions.json; then
            echo "::warning::CCI scraping failed; trying the last deployed JSON."
            curl --fail --silent --show-error https://brahmiamine.github.io/civi/data/cci_sessions.json -o public/data/cci_sessions.json || {
              echo "::error::No fresh or previously deployed CCI session data is available."
              exit 1
            }
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Nothing is published if the question banks or the unit tests fail.
      - run: npm run validate:data
      - run: npm test
      - run: npm run build
      # Browser tests on the build (served at /), then the build for GitHub Pages (/civi/).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
        env:
          BASE_PATH: /civi/
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
