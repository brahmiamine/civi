<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Test Civique</title>
    <meta name="description" content="Entraînement au test civique français : quiz, révisions par thème et examens blancs." />
    <meta name="theme-color" content="#F5F6F8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Test Civique" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Paint the right background before React loads to avoid a light flash in dark mode.
      try {
        var s = JSON.parse(localStorage.getItem('test-civique:v1') || 'null');
        var t = (s && s.settings && s.settings.theme) || 'system';
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.style.background = d ? '#0D111A' : '#F5F6F8';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
